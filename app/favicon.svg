<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" fill="#0E0E0E"/>
  <!-- Camera body -->
  <rect x="10" y="20" width="44" height="30" rx="4" fill="none" stroke="#C8A96E" stroke-width="2.5"/>
  <!-- Lens circle -->
  <circle cx="32" cy="35" r="10" fill="none" stroke="#C8A96E" stroke-width="2.5"/>
  <circle cx="32" cy="35" r="5" fill="#C8A96E" opacity="0.6"/>
  <!-- Shutter bump -->
  <rect x="22" y="14" width="10" height="8" rx="2" fill="none" stroke="#C8A96E" stroke-width="2.5"/>
  <!-- Flash dot -->
  <circle cx="48" cy="26" r="2.5" fill="#C8A96E"/>
  <!-- "S" letterform underneath — subtle -->
</svg>
